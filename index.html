<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strategy Map Builder – โรงพยาบาลสันทราย</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🏥%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f5; --panel:#fff; --ink:#14302b; --muted:#5b6f6a; --line:#dbe5e2;
  --pri:#0f766e; --pri-d:#0b5d57; --pri-t:#e3f2ef; --dark:#0f2e2a;
  --ok:#15803d; --warn:#b45309; --err:#b91c1c; --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Sarabun,"Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.sticky{position:sticky;top:0;z-index:30}
.top{background:var(--dark);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:#14b8a6;display:grid;place-items:center;font-size:16px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.7;line-height:1.2}
.top select{background:#163f3a;border:1px solid #2b5a54;color:#fff;border-radius:8px;padding:6px 10px;max-width:260px}
.top .btn{background:#163f3a;border-color:#2b5a54;color:#fff}
.top .btn:hover{background:#1d4d47}
.top .btn.pri{background:#14b8a6;border-color:#14b8a6;color:#05201d}
.btn.dirty::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#fbbf24;margin-left:6px;vertical-align:middle}
.tabs{display:flex;gap:2px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 14px;scrollbar-width:thin}
.tab{border:0;background:none;padding:11px 12px 9px;cursor:pointer;white-space:nowrap;color:var(--muted);border-bottom:3px solid transparent;font-weight:500}
.tab .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#e8eeec;font-size:12px;font-weight:700;margin-right:6px}
.tab.on{color:var(--pri-d);border-bottom-color:var(--pri)}
.tab.on .n{background:var(--pri);color:#fff}
.preview{background:#fff7e6;color:#7c4a03;font-size:13px;padding:6px 20px;border-bottom:1px solid #f5d9a8}
main{max-width:1320px;margin:0 auto;padding:20px}
h2{font-size:22px;margin:0 0 4px}
h3{font-size:17px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.hint{background:var(--pri-t);border-left:4px solid var(--pri);padding:10px 14px;border-radius:8px;color:#134e48;font-size:14px;margin-bottom:16px}
.hint b{color:var(--pri-d)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid4{grid-template-columns:1fr} main{padding:14px 16px}}
label.f{display:block;font-weight:600;font-size:14px;margin:0 0 4px}
.fld{margin-bottom:12px}
input[type=text],input[type=number],textarea,select{width:100%;padding:8px 10px;border:1px solid #c6d4d0;border-radius:8px;background:#fff}
input:focus,textarea:focus,select:focus{outline:2px solid #99d5cc;border-color:var(--pri)}
textarea{min-height:92px;resize:vertical}
.btn{font-weight:600;border:1px solid #c6d4d0;background:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f1f5f4}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#eef3f2}
.btn.danger{color:var(--err)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 9px;border-radius:99px;background:#eef2f1;margin:3px 4px 0 0;white-space:nowrap}
.chip.click{cursor:pointer;border:1px dashed #9cc7c0;background:#fff}
.chip.click:hover{background:var(--pri-t)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
/* SWOT */
.q{border-radius:var(--r);padding:12px;border:1px solid var(--line)}
.q h4{margin:0 0 6px;font-size:15px}
.q.S{background:#ecfdf5}.q.W{background:#fef2f2}.q.O{background:#eff6ff}.q.T{background:#fffbeb}
.q textarea{min-height:120px;background:#ffffffcc}
.tows-item{display:flex;gap:6px;margin-bottom:6px}
.tows-item input{flex:1}
/* themes */
.theme-row{display:grid;grid-template-columns:44px 1fr 2fr auto;gap:8px;align-items:center;margin-bottom:8px}
.theme-row input[type=color]{width:44px;height:38px;border:1px solid #c6d4d0;border-radius:8px;padding:2px;background:#fff}
@media (max-width:640px){.theme-row{grid-template-columns:44px 1fr auto}.theme-row .desc{grid-column:1/-1}}
/* objectives */
.psec{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:14px;overflow:hidden}
.psec>header{padding:10px 14px;color:#fff;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.psec>header b{font-size:16px}
.psec>header span{font-size:13px;opacity:.9}
.psec .body{padding:12px 14px}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:10px}
.obj{border:1px solid var(--line);border-left:5px solid #94a3b8;border-radius:8px;padding:8px 10px;background:#fcfdfd}
.obj .code{font-weight:700;font-size:13px;color:var(--muted)}
.obj .nm{font-weight:600}
.obj .acts{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.addline{display:grid;grid-template-columns:1fr 200px auto;gap:8px}
@media (max-width:640px){.addline{grid-template-columns:1fr}}
.kpi-hint{font-size:12.5px;color:var(--muted);margin-top:6px}
/* links */
.linkgrid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media (max-width:1000px){.linkgrid{grid-template-columns:1fr}}
.linklist{max-height:420px;overflow:auto;margin-top:10px}
.linkitem{display:flex;gap:6px;align-items:center;padding:5px 6px;border-bottom:1px solid #eef2f1;font-size:14px}
.linkitem .t{flex:1}
.mode{background:#fff7e6;border:1px solid #f5d9a8;border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:10px}
/* map */
.mapbox{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
.mapbox svg{display:block;width:100%;height:auto;min-width:960px}
.mapbox svg [data-id]{cursor:pointer}
.mapbox svg [data-id]:hover rect.box{filter:drop-shadow(0 2px 4px rgba(0,0,0,.18))}
/* checks */
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid #eef2f1}
.checks .ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.ic.ok{background:var(--ok)}.ic.warn{background:#d97706}.ic.err{background:var(--err)}
.score{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.score div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;min-width:130px}
.score b{font-size:24px;display:block}
.exc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.exc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.exc-grid>div{border:1px solid var(--line);border-radius:8px;padding:10px}
/* BSC */
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.bsc{border-collapse:collapse;width:100%;font-size:14px;min-width:980px}
table.bsc th{background:var(--dark);color:#fff;text-align:left;padding:8px;font-weight:600;position:sticky;top:0}
table.bsc td{border-top:1px solid #e5ecea;padding:7px 8px;vertical-align:top}
table.bsc td.pc{color:#fff;font-weight:600;width:130px}
.empty{color:#a0aeaa;font-style:italic}
/* dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(920px,96vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,46,42,.45)}
.dlg-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.dlg-b{padding:16px 18px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.subtbl{width:100%;border-collapse:collapse;font-size:14px}
.subtbl th{font-size:12.5px;text-align:left;color:var(--muted);font-weight:600;padding:4px}
.subtbl td{padding:3px}
.subtbl input{padding:6px 8px}
.ckgrid{display:flex;flex-wrap:wrap;gap:6px 16px}
.ckgrid label{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;place-items:center;z-index:98;font-weight:600}
.loading.show{display:grid}
.navbtns{display:flex;justify-content:space-between;margin-top:18px}

:root{color-scheme:light}
body{background:var(--bg)}
.tour{position:fixed;right:0;top:0;bottom:0;width:340px;background:#fff;border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tour-h{background:var(--dark);color:#fff;padding:14px 16px}
.tour-h b{font-size:16px}
.tour-h .sm{font-size:12.5px;opacity:.8}
.bar{height:8px;background:#163f3a;border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:#14b8a6;border-radius:99px;transition:width .3s}
.tour-list{flex:1;overflow:auto;padding:8px 10px 14px}
.ms{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:10px 8px;border-radius:10px;align-items:start}
.ms+.ms{border-top:1px solid #eef2f1}
.ms .ck{width:24px;height:24px;border-radius:50%;border:2px solid #b9cbc6;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;margin-top:1px}
.ms.done .ck{background:var(--ok);border-color:var(--ok)}
.ms.cur{background:#fff8e6;outline:1px solid #f5d9a8}
.ms.cur .ck{border-color:#d97706}
.ms .t{font-weight:600;font-size:14.5px;line-height:1.4}
.ms.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:#9fb3ae}
.ms .d{font-size:13px;color:var(--muted);line-height:1.45;margin-top:2px}
.ms .go{margin-top:6px}
.tour-f{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:6px;flex-wrap:wrap}
.tour-toggle{display:none}
.done-banner{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;padding:10px 12px;margin:8px 8px 0;font-size:14px}
@media (min-width:1101px){body.has-tour{padding-right:340px}}
@media (max-width:1100px){
  .tour{top:auto;left:0;width:auto;max-height:62vh;border-left:0;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.12)}
  .tour.min .tour-list,.tour.min .tour-f{display:none}
  .tour-toggle{display:inline-block}
  body.has-tour{padding-bottom:120px}
  .toast{bottom:150px}
}
.tab.pulse{position:relative}
.tab.pulse::after{content:"";position:absolute;right:4px;top:8px;width:9px;height:9px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 0 rgba(245,158,11,.6);animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
@media (prefers-reduced-motion:reduce){.tab.pulse::after{animation:none}}
#sys .dlg-b{max-height:70vh;overflow:auto}
.welcome{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media (max-width:640px){.welcome{grid-template-columns:1fr}}
.welcome button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px;cursor:pointer;font:inherit;color:inherit}
.welcome button:hover{border-color:var(--pri);background:var(--pri-t)}
.welcome button b{display:block;font-size:17px;margin-bottom:4px;color:var(--pri-d)}
.simtbl{border-collapse:collapse;font-size:13px;min-width:900px}
.simtbl th{background:#0f766e;color:#fff;padding:6px;text-align:left;font-weight:600}
.simtbl td{border:1px solid #dbe5e2;padding:5px 6px;vertical-align:top}
.sheetbar{display:flex;align-items:center;gap:8px;background:#e8f0ee;padding:6px 10px;border-radius:8px 8px 0 0;font-size:13px;color:#33504a}
</style></head><body>
<div class="sticky">
  <header class="top">
    <div class="brand"><div class="logo">✚</div><div>Strategy Map Builder<small>โรงพยาบาลสันทราย · อ.สันทราย จ.เชียงใหม่</small></div></div>
    <select id="mapSel" title="เลือกแผนที่ที่บันทึกไว้"></select>
    <button class="btn" data-act="newMap">＋ ใหม่</button>
    <button class="btn" data-act="loadExample">ตัวอย่าง</button>
    <button class="btn pri" id="saveBtn" data-act="save">บันทึก</button>
    <button class="btn" data-act="delMap" title="ลบแผนที่นี้">ลบ</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="preview" id="previewBar" hidden>โหมดทดลอง: ยังไม่ได้เชื่อมต่อ Google Apps Script (ตั้งค่า GAS_URL ใน config.js) ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น</div>
</div>
<main id="view"></main>

<dialog id="sys"><div id="sysInner"></div></dialog>
<dialog id="dlg"><div id="dlgInner"></div></dialog>
<div class="toast" id="toast"></div>
<div class="loading" id="loading">กำลังทำงาน…</div>

<script src="config.js"></script>
<script>
/* ================= ค่าคงที่ ================= */
const PERS = [
  {id:'outcome', code:'H', name:'ผลลัพธ์ทางสุขภาพ / พันธกิจ', q:'ประชาชนในพื้นที่มีสุขภาพดีขึ้นอย่างไร', color:'#0f766e', tint:'#e7f4f1', level:4,
   kpi:['ร้อยละผู้ป่วยเบาหวานที่ควบคุมระดับน้ำตาลได้','อัตราตายด้วยโรคหลอดเลือดสมอง']},
  {id:'customer', code:'C', name:'ผู้รับบริการและผู้มีส่วนได้ส่วนเสีย', q:'ผู้ป่วย ชุมชน ภาคีเครือข่าย ต้องการคุณค่าอะไร', color:'#1d4ed8', tint:'#eaf0fd', level:3,
   kpi:['ความพึงพอใจผู้รับบริการ','ระยะเวลารอคอย OPD']},
  {id:'finance', code:'F', name:'การเงินและทรัพยากร', q:'ใช้งบประมาณและทรัพยากรอย่างคุ้มค่าและยั่งยืนอย่างไร', color:'#b45309', tint:'#fdf3e7', level:2,
   kpi:['ระดับวิกฤตการเงิน (Risk Score)','ต้นทุนต่อหน่วยบริการ']},
  {id:'process', code:'P', name:'กระบวนการภายใน', q:'ต้องเก่งกระบวนการใด (คุณภาพ ความปลอดภัย การส่งต่อ การป้องกันโรค)', color:'#6d28d9', tint:'#f2edfc', level:1,
   kpi:['ความครอบคลุมการคัดกรอง','อุบัติการณ์ความเสี่ยงระดับรุนแรง (E–I)']},
  {id:'learning', code:'L', name:'การเรียนรู้และพัฒนา', q:'บุคลากร ระบบสารสนเทศ วัฒนธรรมความปลอดภัย พร้อมแค่ไหน', color:'#4d7c0f', tint:'#eff6e5', level:0,
   kpi:['อัตราการคงอยู่ของบุคลากร','ชั่วโมงพัฒนาบุคลากรต่อคน']}
];
const PGROUPS = [
  {id:'pp',  name:'ส่งเสริมสุขภาพและป้องกันโรค (P&P)'},
  {id:'ps',  name:'บริการรักษาพยาบาลที่มีคุณภาพและปลอดภัย'},
  {id:'ref', name:'ระบบส่งต่อและเครือข่ายบริการ'},
  {id:'gov', name:'การบริหารจัดการและธรรมาภิบาล'}
];
const EXC = [
  {id:'ppp', name:'PP&P Excellence', th:'ส่งเสริมสุขภาพ ป้องกันโรค คุ้มครองผู้บริโภค'},
  {id:'service', name:'Service Excellence', th:'บริการเป็นเลิศ'},
  {id:'people', name:'People Excellence', th:'บุคลากรเป็นเลิศ'},
  {id:'gov', name:'Governance Excellence', th:'บริหารจัดการเป็นเลิศด้วยธรรมาภิบาล'}
];
const TOWS = [
  {id:'SO', name:'SO – ใช้จุดแข็ง ฉวยโอกาส'},
  {id:'WO', name:'WO – แก้จุดอ่อน ด้วยโอกาส'},
  {id:'ST', name:'ST – ใช้จุดแข็ง รับมืออุปสรรค'},
  {id:'WT', name:'WT – ลดจุดอ่อน เลี่ยงอุปสรรค'}
];
const THEME_COLORS = ['#0ea5e9','#f97316','#10b981','#a855f7','#ef4444','#eab308'];
const THEME_SUGGEST = ['ลดโรค NCDs','บริการปลอดภัย','องค์กรสมรรถนะสูง','ดูแลผู้สูงอายุแบบบูรณาการ','สุขภาพแม่และเด็ก','ลดอุบัติเหตุทางถนน'];
const STEPS = [
  {n:1, t:'วิเคราะห์สถานการณ์'},
  {n:2, t:'วิสัยทัศน์และผลลัพธ์'},
  {n:3, t:'ธีมกลยุทธ์'},
  {n:4, t:'วัตถุประสงค์'},
  {n:5, t:'เหตุและผล'},
  {n:6, t:'ตรวจสอบ'},
  {n:7, t:'Balanced Scorecard'},
  {n:8, t:'แผนที่ยุทธศาสตร์'}
];

/* ================= เครื่องมือทั่วไป ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const P = id => PERS.find(p => p.id === id);
function toast(msg, ms = 2600){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
function busy(v){ $('#loading').classList.toggle('show', v); }
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ================= เชื่อมต่อ Apps Script (หรือโหมดทดลอง) ================= */
const CFG = window.APP_CONFIG || {};
const HAS_GAS = !!CFG.GAS_URL;
const Local = {
  _all(){ try { return JSON.parse(store.get('smb_maps') || '{}'); } catch(e){ return {}; } },
  listMaps(){ const a = this._all(); return Object.values(a).map(j => { const m = JSON.parse(j); return {id:m.id, org:m.org, year:m.year, updatedAt:m._u || ''}; }); },
  getMap(id){ const j = this._all()[id]; if (!j) throw new Error('ไม่พบข้อมูล'); return j; },
  saveMap(json){ const m = JSON.parse(json); if (!m.id) m.id = uid(); m._u = new Date().toISOString(); const a = this._all(); a[m.id] = JSON.stringify(m); store.set('smb_maps', JSON.stringify(a)); return {id:m.id, updatedAt:m._u}; },
  deleteMap(id){ const a = this._all(); delete a[id]; store.set('smb_maps', JSON.stringify(a)); return true; },
  exportBSC(){ throw new Error('ส่งออกไป Google Sheet ได้เมื่อติดตั้งเป็น Web App แล้ว (ใช้ปุ่มดาวน์โหลด CSV แทนได้)'); }
};
function ensurePass(){
  if (!CFG.REQUIRE_PASS || store.get('smb_pass')) return Promise.resolve();
  return new Promise((res, rej) => {
    _askRes = v => v ? res() : rej(new Error('ยกเลิกการใส่รหัสผ่าน'));
    sysOpen(`<div class="dlg-h"><b>กรุณาใส่รหัสผ่านเข้าใช้งาน</b></div><div class="dlg-b"><input type="password" id="passIn" autocomplete="current-password" onkeydown="if(event.key==='Enter')ACT.passOk()"></div>
      <div class="dlg-f"><button class="btn" data-act="sysNo">ยกเลิก</button><button class="btn pri" data-act="passOk">เข้าใช้งาน</button></div>`);
    setTimeout(() => { const e = document.getElementById('passIn'); if (e) e.focus(); }, 50);
  });
}
async function remote(fn, args){
  const r = await fetch(CFG.GAS_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({fn, args, pass: store.get('smb_pass') || ''})});
  const j = await r.json();
  if (!j.ok){ if (j.code === 'AUTH') store.del('smb_pass'); throw new Error(j.error || 'เกิดข้อผิดพลาด'); }
  return j.data;
}
function call(fn, ...args){
  if (HAS_GAS) return ensurePass().then(() => remote(fn, args));
  return new Promise((res, rej) => { try { res(Local[fn](...args)); } catch(e){ rej(e); } });
}

  return {id:'', org:'โรงพยาบาลสันทราย', year:'2570', areaData:'', swot:{S:'',W:'',O:'',T:''}, tows:[],
          vision:'', mission:'', outcomes:'', financeBeside:false,
          themes:[], objectives:[], links:[]};
}
let S = blank(), dirty = false, step = 1, linkSrc = null, maps = [], E = null;

function setDirty(v = true){
  dirty = v; $('#saveBtn').classList.toggle('dirty', v);
  if (v) store.set('smb_draft', JSON.stringify(S)); else store.del('smb_draft');
}
function normalize(m){
  const b = blank(); m = Object.assign(b, m || {});
  m.swot = Object.assign({S:'',W:'',O:'',T:''}, m.swot || {});
  m.objectives = (m.objectives || []).map(o => Object.assign({id:uid(), name:'', persp:'process', theme:'', pgroup:'', exc:[], src:[], desc:'', kpis:[], inits:[]}, o));
  return m;
}
function codeMap(){
  const c = {};
  PERS.forEach(p => S.objectives.filter(o => o.persp === p.id).forEach((o, i) => c[o.id] = p.code + (i + 1)));
  return c;
}
const lvl = pid => (S.financeBeside && pid === 'finance') ? 3 : P(pid).level;
const theme = id => S.themes.find(t => t.id === id);
const themeColor = id => (theme(id) || {}).color || '#94a3b8';
const objById = id => S.objectives.find(o => o.id === id);

/* ================= Render หลัก ================= */
function renderTabs(){
  $('#tabs').innerHTML = STEPS.map(s => `<button class="tab ${s.n === step ? 'on' : ''}" data-act="tab" data-s="${s.n}"><span class="n">${s.n === 8 ? '◎' : s.n}</span>${s.t}</button>`).join('');
}
var render = function(){
  renderTabs();
  $('#view').innerHTML = VIEWS[step]() + navBtns();
  if (step === 5) drawMap('#map5', {selected: linkSrc, onClick: linkClick});
  if (step === 8) drawMap('#map8', {onClick: id => openObj(id)});
}
function navBtns(){
  return `<div class="navbtns">
    ${step > 1 ? `<button class="btn" data-act="tab" data-s="${step - 1}">← ${STEPS[step - 2].t}</button>` : '<span></span>'}
    ${step < 8 ? `<button class="btn pri" data-act="tab" data-s="${step + 1}">${STEPS[step].t} →</button>` : ''}
  </div>`;
}
function renderMapSel(){
  const opts = maps.map(m => `<option value="${esc(m.id)}" ${m.id === S.id ? 'selected' : ''}>${esc(m.org || '(ไม่มีชื่อ)')}${m.year ? ' – ' + esc(m.year) : ''}</option>`);
  $('#mapSel').innerHTML = `<option value="">${S.id ? '— เลือกแผนที่ —' : '— แผนที่ใหม่ (ยังไม่บันทึก) —'}</option>` + opts.join('');
}

/* ================= การวาดแผนที่ (SVG) ================= */
const FONT = 'Sarabun, "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif';
const mctx = document.createElement('canvas').getContext('2d');
const segr = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('th', {granularity:'word'}) : null;
function tw(s, size, weight){ mctx.font = `${weight} ${size}px ${FONT}`; return mctx.measureText(s).width; }
function wrap(text, w, size, weight = 400){
  text = String(text || '').replace(/\s+/g, ' ').trim();
  if (!text) return [''];
  const parts = segr ? Array.from(segr.segment(text), s => s.segment) : Array.from(text);
  const lines = []; let cur = '';
  for (let p of parts){
    if (tw(cur + p, size, weight) <= w){ cur += p; continue; }
    if (cur.trim()){ lines.push(cur.trim()); cur = ''; }
    p = p.replace(/^\s+/, '');
    if (tw(p, size, weight) <= w){ cur = p; continue; }
    for (const ch of Array.from(p)){
      if (cur && tw(cur + ch, size, weight) > w){ lines.push(cur); cur = ch; } else cur += ch;
    }
  }
  if (cur.trim()) lines.push(cur.trim());
  return lines;
}
function svgText(x, y, lines, size, weight, fill, anchor = 'start', lh = 1.35){
  return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}">` +
    lines.map((l, i) => `<tspan x="${x}" dy="${i ? size * lh : 0}">${esc(l)}</tspan>`).join('') + `</text>`;
}

function buildMapSVG(opts = {}){
  const W = 1280, PAD = 20, LW = 180, G = 16;
  const cx0 = PAD + LW + 10, cw = W - PAD - cx0;
  const codes = codeMap();
  const thIdx = id => { const i = S.themes.findIndex(t => t.id === id); return i < 0 ? 99 : i; };
  const objsOf = (pid, f) => S.objectives.filter(o => o.persp === pid && (!f || f(o)))
    .map((o, i) => ({o, i})).sort((a, b) => thIdx(a.o.theme) - thIdx(b.o.theme) || a.i - b.i).map(x => x.o);
  const bg = [], boxes = [], arrows = [], pos = {};
  let y = PAD;

  // หัวเรื่อง
  bg.push(svgText(PAD, y + 22, [`Strategy Map: ${S.org || 'ชื่อหน่วยงาน'}${S.year ? '  ปี ' + S.year : ''}`], 22, 700, '#14302b'));
  y += 38;
  // วิสัยทัศน์
  const vw = W - 2 * PAD - 150;
  const vL = wrap(S.vision || '(ยังไม่ได้กำหนดวิสัยทัศน์)', vw, 17, 600);
  const mL = S.mission ? wrap('พันธกิจ: ' + S.mission, vw, 13.5, 400) : [];
  const vh = 22 + vL.length * 23 + (mL.length ? 6 + mL.length * 19 : 0);
  bg.push(`<rect x="${PAD}" y="${y}" width="${W - 2 * PAD}" height="${vh}" rx="10" fill="#0f2e2a"/>`);
  bg.push(svgText(PAD + 18, y + vh / 2 + 6, ['วิสัยทัศน์'], 16, 700, '#5eead4'));
  bg.push(svgText(PAD + 140, y + 11 + 17, vL, 17, 600, '#ffffff'));
  if (mL.length) bg.push(svgText(PAD + 140, y + 11 + 17 + vL.length * 23 + 2, mL, 13.5, 400, '#b7d7d1', 'start', 1.4));
  y += vh + 12;

  const rows = S.financeBeside ? [['outcome'], ['customer', 'finance'], ['process'], ['learning']] : PERS.map(p => [p.id]);
  rows.forEach(r => {
    let segs;
    if (r.length === 2){
      segs = r.map(pid => ({title: P(pid).name, pid, objs: objsOf(pid), w: (cw - G) / 2}));
    } else if (r[0] === 'process'){
      const groups = PGROUPS.map(g => ({title: g.name, pid: 'process', objs: objsOf('process', o => o.pgroup === g.id)})).filter(g => g.objs.length);
      const other = objsOf('process', o => !PGROUPS.some(g => g.id === o.pgroup));
      if (other.length) groups.push({title: groups.length ? 'อื่น ๆ' : null, pid: 'process', objs: other});
      if (groups.length <= 1) segs = [{title: groups[0] && groups[0].title, pid: 'process', objs: objsOf('process'), w: cw}];
      else {
        const tot = groups.reduce((a, g) => a + Math.max(g.objs.length, 1.3), 0);
        segs = groups.map(g => Object.assign(g, {w: (cw - G * (groups.length - 1)) * Math.max(g.objs.length, 1.3) / tot}));
      }
    } else segs = [{title: null, pid: r[0], objs: objsOf(r[0]), w: cw}];

    // คำนวณขนาด
    segs.forEach(sg => {
      const n = sg.objs.length, minW = 150, maxW = 230;
      sg.per = Math.max(1, Math.min(n || 1, Math.floor((sg.w + G) / (minW + G))));
      sg.bw = Math.min(maxW, (sg.w - G * (sg.per - 1)) / sg.per);
      const items = sg.objs.map(o => { const L = wrap(o.name || '(ไม่มีชื่อ)', sg.bw - 22, 14, 500); return {o, L, h: 36 + L.length * 19 + 10}; });
      sg.lines = []; for (let i = 0; i < n; i += sg.per) sg.lines.push(items.slice(i, i + sg.per));
      sg.lineH = sg.lines.map(l => Math.max(...l.map(b => b.h)));
      sg.titleL = sg.title ? wrap(sg.title, sg.w - 24, 12.5, 700) : [];
      sg.headH = sg.titleL.length ? sg.titleL.length * 17 + 8 : 0;
      sg.h = sg.headH + (n ? sg.lineH.reduce((a, b) => a + b, 0) + G * (sg.lines.length - 1) : 36);
    });
    const hh = Math.max(...segs.map(s => s.headH));
    segs.forEach(sg => { sg.h += hh - sg.headH; sg.headH = hh; });
    const rowH = Math.max(86, Math.max(...segs.map(s => s.h)) + 2 * G);
    const p0 = P(r[0]);
    // ป้ายมุมมองด้านซ้าย
    const lblColor = r.length === 2 ? '#334155' : p0.color;
    bg.push(`<rect x="${PAD}" y="${y}" width="${LW}" height="${rowH}" rx="10" fill="${lblColor}"/>`);
    const lblLines = r.flatMap(pid => wrap(P(pid).name, LW - 24, 15, 700));
    bg.push(svgText(PAD + LW / 2, y + rowH / 2 - (lblLines.length - 1) * 10 + 5, lblLines, 15, 700, '#fff', 'middle', 1.33));
    // พื้นหลังและกล่อง
    let sx = cx0;
    segs.forEach((sg, si) => {
      const pp = P(sg.pid);
      bg.push(`<rect x="${sx}" y="${y}" width="${sg.w}" height="${rowH}" rx="10" fill="${pp.tint}" stroke="${pp.color}" stroke-opacity=".25"/>`);
      if (sg.titleL.length) bg.push(svgText(sx + 12, y + G + 10, sg.titleL, 12.5, 700, pp.color, 'start', 1.3));
      if (!sg.objs.length) bg.push(svgText(sx + sg.w / 2, y + rowH / 2 + 5, ['ยังไม่มีวัตถุประสงค์'], 13, 400, '#94a3b8', 'middle'));
      let ly = y + G + sg.headH;
      sg.lines.forEach((line, li) => {
        const lh = sg.lineH[li], tot = line.length * sg.bw + (line.length - 1) * G;
        let bx = sx + (sg.w - tot) / 2;
        line.forEach(b => {
          const o = b.o, col = themeColor(o.theme), sel = opts.selected === o.id;
          pos[o.id] = {x: bx, y: ly, w: sg.bw, h: lh};
          boxes.push(`<g data-id="${o.id}">
            <rect class="box" x="${bx}" y="${ly}" width="${sg.bw}" height="${lh}" rx="12" fill="${sel ? '#fff8db' : '#fff'}" stroke="${sel ? '#d97706' : col}" stroke-width="${sel ? 3.5 : 2}"/>
            <rect x="${bx + 10}" y="${ly + 9}" width="${tw(codes[o.id], 12, 700) + 14}" height="19" rx="9.5" fill="${col}"/>
            ${svgText(bx + 17, ly + 23, [codes[o.id]], 12, 700, '#fff')}
            ${svgText(bx + 11, ly + 48, b.L, 14, 500, '#1e293b', 'start', 1.36)}
          </g>`);
          bx += sg.bw + G;
        });
        ly += lh + G;
      });
      if (si < segs.length - 1) sx += sg.w + G;
    });
    y += rowH + 10;
  });

  // ลูกศร
  const outN = {}, inN = {}, outI = {}, inI = {};
  S.links.forEach(l => { outN[l.from] = (outN[l.from] || 0) + 1; inN[l.to] = (inN[l.to] || 0) + 1; });
  S.links.forEach(l => {
    const a = pos[l.from], b = pos[l.to]; if (!a || !b) return;
    const ko = outI[l.from] = (outI[l.from] || 0) + 1, ki = inI[l.to] = (inI[l.to] || 0) + 1;
    const off = (k, n, w) => Math.max(-w * .35, Math.min(w * .35, (k - 1 - (n - 1) / 2) * 14));
    let d;
    if (Math.abs(a.y - b.y) < 4){
      const right = a.x < b.x;
      const x1 = right ? a.x + a.w : a.x, x2 = right ? b.x : b.x + b.w, y1 = a.y + a.h / 2, y2 = b.y + b.h / 2;
      d = `M${x1} ${y1} C${(x1 + x2) / 2} ${y1} ${(x1 + x2) / 2} ${y2} ${x2} ${y2}`;
    } else {
      const up = a.y > b.y;
      const x1 = a.x + a.w / 2 + off(ko, outN[l.from], a.w), x2 = b.x + b.w / 2 + off(ki, inN[l.to], b.w);
      const y1 = up ? a.y : a.y + a.h, y2 = up ? b.y + b.h + 2 : b.y - 2;
      const dy = (y2 - y1) / 2;
      d = `M${x1} ${y1} C${x1} ${y1 + dy} ${x2} ${y2 - dy} ${x2} ${y2}`;
    }
    arrows.push(`<path d="${d}" fill="none" stroke="#334155" stroke-width="1.7" stroke-opacity=".7" marker-end="url(#ah)"/>`);
  });

  // คำอธิบายสัญลักษณ์
  let lx = PAD; const ly = y + 14;
  const legend = [svgText(lx, ly + 4, ['ธีมกลยุทธ์:'], 13, 700, '#334155')];
  lx += 82;
  S.themes.forEach(t => {
    legend.push(`<rect x="${lx}" y="${ly - 8}" width="14" height="14" rx="4" fill="${t.color}"/>`);
    legend.push(svgText(lx + 20, ly + 4, [t.name || '-'], 13, 500, '#334155'));
    lx += 20 + tw(t.name || '-', 13, 500) + 22;
  });
  legend.push(svgText(W - PAD, ly + 4, ['→ ลูกศร = ความสัมพันธ์เหตุและผล (ล่าง → บน)'], 12.5, 400, '#64748b', 'end'));
  const H = ly + 26;

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family='${FONT}'>
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs>
    <rect width="${W}" height="${H}" fill="#fff"/>
    ${bg.join('')}${arrows.join('')}${boxes.join('')}${legend.join('')}
  </svg>`;
}
function drawMap(sel, opts){
  const box = $(sel); if (!box) return;
  const go = () => {
    box.innerHTML = buildMapSVG(opts);
    box.onclick = e => { const g = e.target.closest('[data-id]'); if (g && opts.onClick) opts.onClick(g.dataset.id); };
  };
  go();
  if (document.fonts && document.fonts.status !== 'loaded') document.fonts.ready.then(go);
}
function linkClick(id){
  if (!linkSrc){ linkSrc = id; render(); return; }
  if (linkSrc === id){ linkSrc = null; render(); return; }
  addLink(linkSrc, id); linkSrc = null; render();
}
function addLink(from, to){
  if (!from || !to || from === to) return toast('เลือกต้นทางและปลายทางที่ต่างกัน');
  if (S.links.some(l => l.from === from && l.to === to)) return toast('มีลูกศรนี้อยู่แล้ว');
  S.links.push({from, to}); setDirty();
  const a = objById(from), b = objById(to);
  if (lvl(a.persp) > lvl(b.persp)) toast('⚠ ลูกศรชี้จากบนลงล่าง — ปกติเหตุและผลควรชี้จากล่างขึ้นบน', 4000);
}

/* ================= ตรวจสอบ ================= */
function runChecks(){
  const R = [], codes = codeMap(), list = ids => ids.map(id => codes[id]).join(', ');
  const push = (lv, t, d) => R.push({lv, t, d});
  push(S.vision.trim() ? 'ok' : 'err', S.vision.trim() ? 'กำหนดวิสัยทัศน์แล้ว' : 'ยังไม่ได้กำหนดวิสัยทัศน์');
  const sw = ['S','W','O','T'].filter(k => S.swot[k].trim()).length;
  push(sw === 4 ? 'ok' : 'warn', sw === 4 ? 'วิเคราะห์ SWOT ครบ 4 ด้าน' : `SWOT ยังไม่ครบ (มี ${sw}/4 ด้าน)`);
  push(S.areaData.trim() ? 'ok' : 'warn', S.areaData.trim() ? 'มีข้อมูลสุขภาพพื้นที่ประกอบการวิเคราะห์' : 'ยังไม่มีข้อมูลสุขภาพพื้นที่ (สาเหตุการตาย NCDs ประชากรสูงวัย)');
  const nt = S.themes.length;
  push(nt >= 3 && nt <= 4 ? 'ok' : 'warn', `มีธีมกลยุทธ์ ${nt} ธีม` + (nt >= 3 && nt <= 4 ? '' : ' (แนะนำ 3–4 ธีม)'));
  const missP = PERS.filter(p => !S.objectives.some(o => o.persp === p.id));
  push(missP.length ? 'err' : 'ok', missP.length ? 'บางมุมมองยังไม่มีวัตถุประสงค์' : 'ทุกมุมมองมีวัตถุประสงค์อย่างน้อย 1 ข้อ', missP.map(p => p.name).join(', '));
  const noTh = S.objectives.filter(o => !theme(o.theme));
  if (S.objectives.length) push(noTh.length ? 'warn' : 'ok', noTh.length ? `วัตถุประสงค์ ${noTh.length} ข้อยังไม่ระบุธีม` : 'ทุกวัตถุประสงค์ระบุธีมแล้ว', list(noTh.map(o => o.id)));
  S.themes.forEach(t => {
    const ps = new Set(S.objectives.filter(o => o.theme === t.id).map(o => o.persp));
    if (ps.size < 3) push('warn', `ธีม “${esc(t.name)}” ครอบคลุมเพียง ${ps.size} มุมมอง`, 'ธีมที่ดีควรมีวัตถุประสงค์ไล่ตั้งแต่การเรียนรู้ → กระบวนการ → ผู้รับบริการ/ผลลัพธ์สุขภาพ');
  });
  // ความเชื่อมโยง
  if (S.objectives.length){
    const linked = new Set(S.links.flatMap(l => [l.from, l.to]));
    const iso = S.objectives.filter(o => !linked.has(o.id));
    push(iso.length ? 'err' : 'ok', iso.length ? `วัตถุประสงค์ที่ไม่มีลูกศรเชื่อมเลย ${iso.length} ข้อ` : 'ทุกวัตถุประสงค์มีลูกศรเชื่อมโยง', list(iso.map(o => o.id)));
    const top = new Set(S.objectives.filter(o => o.persp === 'outcome').map(o => o.id));
    const adj = {}; S.links.forEach(l => (adj[l.from] = adj[l.from] || []).push(l.to));
    const reach = id => { const seen = new Set([id]), q = [id]; while (q.length){ const c = q.shift(); if (top.has(c)) return true; (adj[c] || []).forEach(n => { if (!seen.has(n)){ seen.add(n); q.push(n); } }); } return false; };
    const dead = S.objectives.filter(o => !top.has(o.id) && !reach(o.id));
    push(dead.length ? 'warn' : 'ok', dead.length ? `วัตถุประสงค์ ${dead.length} ข้อ ยังส่งผลไม่ถึงผลลัพธ์ทางสุขภาพ` : 'ทุกวัตถุประสงค์มีเส้นทางเหตุและผลไปถึงผลลัพธ์ทางสุขภาพ', list(dead.map(o => o.id)));
    const down = S.links.filter(l => { const a = objById(l.from), b = objById(l.to); return a && b && lvl(a.persp) > lvl(b.persp); });
    if (down.length) push('warn', `มีลูกศรชี้จากบนลงล่าง ${down.length} เส้น`, down.map(l => codes[l.from] + '→' + codes[l.to]).join(', '));
  }
  // 4 Excellence
  const missE = EXC.filter(x => !S.objectives.some(o => (o.exc || []).includes(x.id)));
  push(missE.length ? 'warn' : 'ok', missE.length ? 'ยังไม่ครอบคลุม 4 Excellence ของกระทรวงฯ' : 'สอดคล้องครบทั้ง 4 Excellence', missE.map(x => x.name).join(', '));
  // TOWS
  const tw_ = S.tows.filter(t => t.text.trim());
  if (!tw_.length) push('warn', 'ยังไม่มีกลยุทธ์จาก TOWS Matrix ให้ตรวจความครอบคลุม');
  else {
    const used = new Set(S.objectives.flatMap(o => o.src || []));
    const un = tw_.filter(t => !used.has(t.id));
    push(un.length ? 'warn' : 'ok', un.length ? `กลยุทธ์ TOWS ${un.length} ข้อ ยังไม่ถูกแปลงเป็นวัตถุประสงค์` : 'ทุกกลยุทธ์ TOWS ถูกแปลงเป็นวัตถุประสงค์แล้ว', un.map(t => `${t.type}: ${esc(t.text)}`).join(' · '));
  }
  // BSC
  if (S.objectives.length){
    const noK = S.objectives.filter(o => !o.kpis.some(k => k.name.trim()));
    push(noK.length ? 'warn' : 'ok', noK.length ? `วัตถุประสงค์ ${noK.length} ข้อ ยังไม่มี KPI` : 'ทุกวัตถุประสงค์มี KPI', list(noK.map(o => o.id)));
    const noT = S.objectives.filter(o => o.kpis.some(k => k.name.trim() && !String(k.target).trim()));
    if (noT.length) push('warn', `มี KPI ที่ยังไม่กำหนดค่าเป้าหมาย`, list(noT.map(o => o.id)));
    const noI = S.objectives.filter(o => !o.inits.some(i => i.name.trim()));
    if (noI.length) push('warn', `วัตถุประสงค์ ${noI.length} ข้อ ยังไม่มีโครงการรองรับ`, list(noI.map(o => o.id)));
  }
  return R;
}

function download(name, data, type){
  const b = data instanceof Blob ? data : new Blob([data], {type: type || 'application/octet-stream'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const fileBase = () => ('StrategyMap_' + (S.org || 'map') + (S.year ? '_' + S.year : '')).replace(/[\\/:*?"<>|\s]+/g, '_');
function bscRows(){
  const codes = codeMap();
  const rows = [['มุมมอง','รหัส','วัตถุประสงค์','ธีม','4 Excellence','KPI','หน่วย','ค่าฐาน','ค่าเป้าหมาย','ความถี่','ผู้รับผิดชอบ KPI','โครงการ','งบประมาณ','ผู้รับผิดชอบโครงการ','ระยะเวลา']];
  PERS.forEach(p => S.objectives.filter(o => o.persp === p.id).forEach(o => {
    const n = Math.max(o.kpis.length, o.inits.length, 1);
    for (let i = 0; i < n; i++){
      const k = o.kpis[i] || {}, it = o.inits[i] || {};
      rows.push([p.name, codes[o.id], o.name, (theme(o.theme) || {}).name || '', (o.exc || []).map(e => EXC.find(x => x.id === e).name).join(', '),
        k.name || '', k.unit || '', k.baseline || '', k.target || '', k.freq || '', k.owner || '', it.name || '', it.budget || '', it.owner || '', it.period || '']);
    }
  }));
  return rows;
}

/* ================= หน้าต่างระบบ (แทน confirm/alert) ================= */
let _askRes = null;
function sysOpen(html){ $('#sysInner').innerHTML = html; const d = $('#sys'); if (!d.open) d.showModal(); }
function sysClose(v){ const d = $('#sys'); if (d.open) d.close(); if (_askRes){ const r = _askRes; _askRes = null; r(v); } }
function ask(msg){
  return new Promise(res => {
    _askRes = res;
    sysOpen(`<div class="dlg-h"><b>ยืนยัน</b></div><div class="dlg-b">${esc(msg)}</div>
      <div class="dlg-f"><button class="btn" data-act="sysNo">ยกเลิก</button><button class="btn pri" data-act="sysYes">ตกลง</button></div>`);
  });
}
function info(title, html){
  sysOpen(`<div class="dlg-h"><b style="font-size:17px">${title}</b><span class="spacer"></span><button class="btn sm ghost" data-act="sysNo" aria-label="ปิด">✕</button></div>
    <div class="dlg-b">${html}</div><div class="dlg-f"><button class="btn pri" data-act="sysNo">ปิด</button></div>`);
}
ACT.sysYes = () => sysClose(true);
ACT.sysNo = () => sysClose(false);
ACT.passOk = () => { const v = (document.getElementById('passIn') || {}).value || ''; if (!v.trim()) return; store.set('smb_pass', v.trim()); sysClose(true); };
$('#sys').addEventListener('cancel', () => sysClose(false));

/* ================= เริ่มต้น ================= */
(function init(){
  if (!HAS_GAS) $('#previewBar').hidden = false;
  const draft = store.get('smb_draft');
  if (draft){ try { S = normalize(JSON.parse(draft)); dirty = true; $('#saveBtn').classList.add('dirty'); toast('กู้คืนฉบับร่างที่ยังไม่ได้บันทึกแล้ว'); } catch(e){} }
  render(); refreshList();
})();
</script>
